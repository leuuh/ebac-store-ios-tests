name: CI - Testes iOS no Sauce Labs

# [M30] Roda os testes mobile na Device Farm (Sauce Labs) a cada push na branch ci.
# Tambem pode ser disparado manualmente (workflow_dispatch) para re-executar.

on:
  push:
    branches:
      - ci
  workflow_dispatch:

jobs:
  sauce-tests:
    name: Testes iOS no Sauce Labs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # [M30] As credenciais do Sauce Labs vêm dos secrets do GitHub Actions.
    # Configure em: Settings > Secrets and variables > Actions
    #   SAUCE_USERNAME
    #   SAUCE_ACCESS_KEY
    env:
      SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
      SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
      RUN_ON: sauce

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências (npm ci — reprodutível)
        # [M30] Antes usei npm install; mudei para npm ci que respeita o package-lock.json
        # e falha se tiver divergência — melhor pra CI.
        run: npm ci

      # [M30] No Sauce Labs nao precisa instalar o driver XCUITest (a nuvem já tem).
      # Deixei comentado pra lembrar que em ambiente local (simulador) seria necessário.
      # - name: Instalar driver XCUITest (Appium)
      #   run: npx appium driver install xcuitest

      # [M30] Preflight barato (~2s) que responde a pergunta que me custou um run
      # inteiro: "a conta pode alocar device real agora?". O run 32394032972 morreu
      # em 8s com "We couldn't find a MATCHING device ... You have 0 public device
      # concurrency" — nao era bug de codigo, era cota da conta. Como a mensagem
      # vem no meio de 260 linhas de log do wdio, imprimo a concorrencia e a
      # contagem de iPhones livres ANTES de subir a suite.
      - name: Preflight Sauce (concorrência e devices livres)
        run: |
          echo "--- concorrência da conta ---"
          curl -s -u "$SAUCE_USERNAME:$SAUCE_ACCESS_KEY" \
            "https://api.us-west-1.saucelabs.com/rest/v1.2/users/$SAUCE_USERNAME/concurrency" \
            | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(d))"
          echo ""
          echo "--- iPhones disponíveis agora ---"
          curl -s -u "$SAUCE_USERNAME:$SAUCE_ACCESS_KEY" \
            "https://api.us-west-1.saucelabs.com/v1/rdc/devices/available" \
            | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{let v;try{v=JSON.parse(d)}catch(e){return console.log('resposta nao-JSON:',d.slice(0,300))};const l=Array.isArray(v)?v:(v.entities||v.devices||[]);const ip=l.filter(x=>/iphone|ipad/i.test(typeof x==='string'?x:(x.name||x.id||'')));console.log('total livres:',l.length,'| iOS livres:',ip.length);console.log(ip.slice(0,15).map(x=>typeof x==='string'?x:(x.name||x.id)).join('\n'))})"

      - name: Rodar testes iOS no Sauce Labs
        run: npm run test:sauce

      # 'always()' e nao 'failure()': o probe engole os erros num try/catch pra
      # conseguir medir tudo numa sessao so, entao o job termina verde mesmo
      # quando o diagnostico falhou — e o print, que e justamente a prova do
      # que esta na tela, nunca subia. Artefato de diagnostico tem que subir
      # sempre, senao eu fico cego exatamente quando mais preciso ver.
      - name: Upload de artefatos (sempre)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wdio-logs-e-screenshots
          path: |
            errorShots/
            logs/
          retention-days: 7